<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Maturity — Group Results</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;padding:1.5rem}
  .page{max-width:800px;margin:0 auto}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
  h1{font-size:1.5rem;font-weight:600;color:#111}
  .meta{font-size:0.8125rem;color:#9ca3af}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:8px 16px;border-radius:8px;font-size:0.8125rem;font-weight:500;cursor:pointer;border:1.5px solid #d1d5db;background:#fff;color:#374151;transition:background 0.15s}
  .btn:hover{background:#f9fafb}
  .btn-p{background:#2563eb;color:#fff;border-color:#2563eb}
  .btn-p:hover{background:#1d4ed8}
  .btn-danger{border-color:#fca5a5;color:#dc2626;background:#fff}
  .btn-danger:hover{background:#fef2f2}
  .overall{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.5rem}
  .ov-num{font-size:3.5rem;font-weight:700;line-height:1}
  .ov-label{font-size:1.1rem;font-weight:600;margin-bottom:4px}
  .ov-sub{font-size:0.8125rem;color:#6b7280}
  .legend{display:flex;gap:1.25rem;margin-bottom:1.25rem;flex-wrap:wrap}
  .leg{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:#6b7280}
  .leg-dot{width:10px;height:10px;border-radius:50%}
  .cat-list{background:#fff;border-radius:14px;border:1px solid #e5e7eb;overflow:hidden}
  .cat-row{padding:14px 20px;border-bottom:1px solid #f3f4f6}
  .cat-row:last-child{border-bottom:none}
  .crow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .crow-name{font-size:0.9375rem;font-weight:500;color:#111}
  .crow-score{font-size:0.8125rem;color:#6b7280}
  .bar-bg{height:8px;background:#f3f4f6;border-radius:4px}
  .bar-fill{height:8px;border-radius:4px;transition:width 0.8s ease}
  .badge{display:inline-block;font-size:0.6875rem;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .b-basic{background:#fee2e2;color:#991b1b}
  .b-inter{background:#fef3c7;color:#92400e}
  .b-adv{background:#d1fae5;color:#065f46}
  .empty{text-align:center;padding:3rem;color:#9ca3af;font-size:0.875rem}
  .confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
  .confirm-overlay.open{display:flex}
  .confirm-box{background:#fff;border-radius:14px;padding:2rem;max-width:360px;width:90%;text-align:center}
  .confirm-box h2{font-size:1.125rem;font-weight:600;margin-bottom:0.5rem}
  .confirm-box p{font-size:0.875rem;color:#6b7280;margin-bottom:1.5rem;line-height:1.6}
  .confirm-btns{display:flex;gap:10px;justify-content:center}
  .export-notice{font-size:0.75rem;color:#6b7280;margin-top:0.75rem;text-align:center}
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div>
      <h1>Group results</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="actions">
      <button class="btn btn-p" onclick="loadResults()">↻ Refresh</button>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-danger" onclick="document.getElementById('confirm').classList.add('open')">Reset results</button>
    </div>
  </div>

  <div id="main-content"><div class="empty">Loading results…</div></div>
  <div class="export-notice" id="export-notice"></div>
</div>

<!-- Reset confirm modal -->
<div class="confirm-overlay" id="confirm">
  <div class="confirm-box">
    <h2>Reset all results?</h2>
    <p>This will permanently delete all submitted responses. Use this before a new session. This cannot be undone.</p>
    <div class="confirm-btns">
      <button class="btn" onclick="document.getElementById('confirm').classList.remove('open')">Cancel</button>
      <button class="btn btn-danger" onclick="resetResults()">Yes, reset</button>
    </div>
  </div>
</div>

<script>
// ── CONFIGURATION ──────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOREbB7WHFc_0RDOy6qm3ROAePchJbTz_ENqHDiEgDiyaVm0_yWRh3ie4lqRSIYLNK/exec';
// ──────────────────────────────────────────────────────────────────────────

const CATS = [
  'Stakeholder Partnering','Demand Management','Budget Alignment','Business Intake',
  'Category Management','Sourcing','Contract Management','Supplier Management',
  'Risk & Resiliency','Sustainability & Inclusion','Order to OK 2 Pay',
  'Insights & Analytics','Control & Monitoring'
];

let lastData = null;

function matLabel(v){return v<1.67?'Basic':v<2.34?'Intermediate':'Advanced';}
function barColor(v){return v<1.67?'#ef4444':v<2.34?'#f59e0b':'#10b981';}
function badgeClass(v){return v<1.67?'b-basic':v<2.34?'b-inter':'b-adv';}
function ovColor(v){return v<1.67?'#dc2626':v<2.34?'#d97706':'#059669';}

async function loadResults(){
  document.getElementById('meta').textContent='Refreshing…';
  try{
    const r=await fetch(SCRIPT_URL+'?action=results');
    const data=await r.json();
    lastData=data;
    render(data);
  } catch(e){
    document.getElementById('meta').textContent='Error loading — check SCRIPT_URL';
    document.getElementById('main-content').innerHTML='<div class="empty">Could not connect to the results server.</div>';
  }
}

function render(data){
  const n=data.count||0;
  document.getElementById('meta').textContent=`${n} response${n===1?'':'s'} · Last updated ${new Date().toLocaleTimeString()}`;

  if(n===0){
    document.getElementById('main-content').innerHTML='<div class="empty">No responses yet. Share the survey link with participants.</div>';
    return;
  }

  const avgs=data.totals.map(t=>t/n);
  const overall=avgs.reduce((a,b)=>a+b,0)/avgs.length;

  let html=`<div class="overall">
    <div class="ov-num" style="color:${ovColor(overall)}">${overall.toFixed(1)}</div>
    <div>
      <div class="ov-label" style="color:${ovColor(overall)}">${matLabel(overall)} maturity</div>
      <div class="ov-sub">Overall average across all 13 categories &nbsp;·&nbsp; scale: 1 (Basic) – 3 (Advanced)</div>
    </div>
  </div>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Basic (1.0–1.66)</div>
    <div class="leg"><div class="leg-dot" style="background:#f59e0b"></div>Intermediate (1.67–2.33)</div>
    <div class="leg"><div class="leg-dot" style="background:#10b981"></div>Advanced (2.34–3.0)</div>
  </div>
  <div class="cat-list">`;

  avgs.forEach((avg,i)=>{
    html+=`<div class="cat-row">
      <div class="crow-top">
        <span class="crow-name">${CATS[i]}<span class="badge ${badgeClass(avg)}">${matLabel(avg)}</span></span>
        <span class="crow-score">${avg.toFixed(2)} / 3.00</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${((avg/3)*100).toFixed(1)}%;background:${barColor(avg)}"></div></div>
    </div>`;
  });

  html+='</div>';
  document.getElementById('main-content').innerHTML=html;
}

function exportCSV(){
  if(!lastData||!lastData.count){alert('No data to export yet.');return;}
  const n=lastData.count;
  const avgs=lastData.totals.map(t=>t/n);
  const overall=avgs.reduce((a,b)=>a+b,0)/avgs.length;
  let csv='Category,Average Score,Maturity Level\n';
  CATS.forEach((c,i)=>csv+=`"${c}",${avgs[i].toFixed(2)},${matLabel(avgs[i])}\n`);
  csv+=`\nOVERALL,${overall.toFixed(2)},${matLabel(overall)}\n`;
  csv+=`Responses,${n},\n`;
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`procurement-maturity-results-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  document.getElementById('export-notice').textContent='CSV downloaded — open in Excel or Google Sheets.';
}

async function resetResults(){
  document.getElementById('confirm').classList.remove('open');
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'reset'})});
    lastData=null;
    document.getElementById('main-content').innerHTML='<div class="empty">Results cleared. Ready for a new session.</div>';
    document.getElementById('meta').textContent='0 responses';
  } catch(e){
    alert('Reset failed — check your connection.');
  }
}

loadResults();
setInterval(loadResults, 15000);
</script>
</body>
</html>
